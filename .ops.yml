# Read by portfolio-ops jobs (dispatcher, scans, test review). Changes need human-approved.
app: the-island
web: true
install: npm ci
verify: npm run lint && npm run check && npm run test:unit && npm run build
e2e: npx playwright test --trace off
# coverage, dead_code and mutation are not set up yet.
# Agent-safe tier (portfolio-ops decision 0005): agent PRs for queued, non-pivotal issues merge without human-approved unless they touch a path below.
agent_safe: true
agent_max_lines: 400
# Trial (portfolio-ops decision 0017): a pull request held only by a pivotal_paths file goes to the stronger session's check, not to Jordan, when the issue it implements names a spec that is approved on the default branch. To turn it off, remove the next line.
pivotal_spec_check: true
sensitive_paths:
  - docs/script-guardrails.md  # safety rules every session script must pass
  - scripts/lint-script.mjs  # the automated safety lint; a wrong change could let an unsafe script through
  - tests/fixtures/scripts/  # fixtures that prove the safety lint rejects unsafe scripts
  - content/sessions/  # session scripts; publishing is never automatic, Jordan listens first
  - content/world-bible.md  # fixes the island's places so every session stays consistent
  - content/places.json  # place data other parts of the app rely on
  - public/sw.js  # service worker; a bad change can break offline use or serve stale pages
  - src/lib/shell.ts  # offline cache name and precache list used by the service worker
  - scripts/precache-assets.mjs  # post-build step that rewrites the service worker
  - astro.config.mjs  # build and deploy configuration
pivotal_paths:
  - src/pages/index.astro  # the landing screen: what the app is, in five seconds
  - src/components/Player.svelte  # the listening flow: rate, listen, rate again
  - src/layouts/Base.astro  # the frame around every screen
  - src/lib/site.ts  # the tagline and public wording, which carry the no-claims rule
