name: voice-script

# Voices an approved script (Jordan merged it to main): one narrator voice, pauses and silences,
# mastered to -16 LUFS / -1 dBTP, plus a transcript. Output is kept as a workflow artifact only;
# images, staging upload and publishing are separate steps.
# Needs the repo secret VOICE_API_KEY (added by Jordan) and voice.voiceId in scripts/pipeline.config.json.

on:
  push:
    branches: [main]
    paths:
      - 'content/sessions/*/script.md'
  workflow_dispatch:
    inputs:
      day:
        description: 'Curriculum day to voice'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: voice-script
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOICE_API_KEY: ${{ secrets.VOICE_API_KEY }}
      INPUT_DAY: ${{ inputs.day }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Voice the script(s)
        run: |
          if [ -n "$INPUT_DAY" ]; then
            case "$INPUT_DAY" in (*[!0-9]*) echo "day must be a number" >&2; exit 1;; esac
            days="$INPUT_DAY"
          else
            days=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'content/sessions/*/script.md' | sed -E 's#content/sessions/([0-9]+)/script.md#\1#')
          fi
          [ -n "$days" ] || { echo "No script changed." >&2; exit 0; }
          for d in $days; do node scripts/voice-script.mjs --day "$((10#$d))"; done
      - uses: actions/upload-artifact@v4
        with:
          name: session-audio
          path: build/audio/
          if-no-files-found: ignore
