# GENERATED from portfolio-ops/gate — do not edit here; run `npm run build:gate` in portfolio-ops.
# Sets the required `review-gate` commit status and the risk:low / risk:normal label.
name: pr-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to re-evaluate
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      # Never checks out PR code: safe under pull_request_target.
      - uses: actions/github-script@v7
        with:
          script: |
            const gate = (() => { const module = { exports: {} };
              // PR gate: classifies risk and decides the `review-gate` commit status.
              // Pure logic only (no network) so it can be unit-tested; the workflow
              // template gathers the data and posts the result.

              const PROTECTED = [
                /^\.github\//, /^AGENTS\.md$/, /^CLAUDE\.md$/, /^\.ops\.yml$/, /^\.claude\//,
                /^specs\//, /^docs\/vision\.md$/, /^docs\/decisions\//,
              ];
              const TEST_PATH = [
                /(^|\/)(tests?|__tests__|e2e|spec)\//, /\.(test|spec)\.[cm]?[jt]sx?$/,
                /(^|\/)test_[^/]*\.py$/, /_test\.py$/, /(^|\/)src\/(test|androidTest)\//,
              ];
              const DOC_PATH = [/\.md$/, /^docs\//];
              // A removed line in a test file that looks like a test or an assertion.
              const REMOVED_TEST_LINE = /^-(?!--).*(\b(it|test|describe)\s*\(|def test_|@Test\b|\bexpect\s*\(|\bassert)/m;
              // An added line that disables or narrows tests.
              const ADDED_SKIP_LINE = /^\+(?!\+\+).*(\.(skip|only|todo)\s*\(|\bx(it|describe)\s*\(|@pytest\.mark\.skip|@Ignore\b|@Disabled\b)/m;
              const REVIEWER = /(codex|chatgpt|openai|claude)/i;
              const BLOCKING_FINDING = /(badge\/P[01]-|\bP[01]\s*Badge|\[P[01]\]|\bP[01]:)/i;

              const isProtected = (f) => PROTECTED.some((r) => r.test(f));
              const isTest = (f) => TEST_PATH.some((r) => r.test(f));
              const isDoc = (f) => DOC_PATH.some((r) => r.test(f));

              function classifyFile(file) {
                const { filename, status, patch = '' } = file;
                if (isProtected(filename)) return { low: false, why: `protected path ${filename}` };
                if (isTest(filename)) {
                  if (status === 'removed') return { low: false, why: `test file deleted: ${filename}` };
                  if (REMOVED_TEST_LINE.test(patch)) return { low: false, why: `test or assertion removed in ${filename}` };
                  if (ADDED_SKIP_LINE.test(patch)) return { low: false, why: `test skipped or narrowed in ${filename}` };
                  return { low: true, why: 'tests added' };
                }
                if (isDoc(filename) && status !== 'removed') return { low: true, why: 'docs' };
                return { low: false, why: `code change ${filename}` };
              }

              function isPatchBump(title) {
                const m = /from v?(\d+)\.(\d+)\.(\d+)\S* to v?(\d+)\.(\d+)\.(\d+)/.exec(title || '');
                return !!m && m[1] === m[4] && m[2] === m[5];
              }

              function classify({ author, title, labels, files }) {
                if (files.some((f) => isProtected(f.filename))) {
                  return { risk: 'normal', reasons: files.filter((f) => isProtected(f.filename)).map((f) => `protected path ${f.filename}`) };
                }
                if (author === 'dependabot[bot]') {
                  return isPatchBump(title)
                    ? { risk: 'low', reasons: ['dependency patch bump'] }
                    : { risk: 'normal', reasons: ['dependency minor/major bump'] };
                }
                if (labels.includes('type:dead-code')) {
                  const onlyDeletes = files.every((f) => f.status !== 'removed' && f.additions === 0);
                  return onlyDeletes
                    ? { risk: 'low', reasons: ['dead-code removal: deletions only, no files removed'] }
                    : { risk: 'normal', reasons: ['dead-code PR adds lines or deletes whole files'] };
                }
                const results = files.map(classifyFile);
                const blockers = results.filter((r) => !r.low).map((r) => r.why);
                return blockers.length ? { risk: 'normal', reasons: blockers } : { risk: 'low', reasons: [...new Set(results.map((r) => r.why))] };
              }

              // The last `labeled` event for human-approved must be by the owner, done
              // directly (web UI / gh CLI), not through a GitHub App such as an agent.
              function humanApproved({ labels, labelEvents, owner }) {
                if (!labels.includes('human-approved')) return false;
                const last = labelEvents.filter((e) => e.event === 'labeled' && e.label === 'human-approved').at(-1);
                return !!last && last.actor === owner && !last.viaApp;
              }

              // feedback: reviews, comments and reactions from reviewer bots, each with
              // { author, body, at } (ISO time); headAt: when the head commit was pushed.
              function reviewState({ labels, feedback, headAt }) {
                if (labels.includes('review:blocking')) return 'blocking';
                const fresh = feedback.filter((x) => REVIEWER.test(x.author) && /\[bot\]$/.test(x.author) && x.at >= headAt);
                if (fresh.some((x) => BLOCKING_FINDING.test(x.body || ''))) return 'blocking';
                if (labels.includes('review:clear') || fresh.length) return 'clear';
                return 'missing';
              }

              function decide(input) {
                const { risk, reasons } = classify(input);
                const review = input.author === 'dependabot[bot]' && risk === 'low' ? 'clear' : reviewState(input);
                const approved = humanApproved(input);
                let state; let description;
                if (input.draft) { state = 'pending'; description = 'Draft PR'; }
                else if (review === 'blocking') { state = 'failure'; description = 'Reviewer found P0/P1 issues (or review:blocking)'; }
                else if (review === 'missing') { state = 'pending'; description = 'Waiting for cross-model review'; }
                else if (risk === 'low') { state = 'success'; description = 'risk:low and reviewed'; }
                else if (approved) { state = 'success'; description = 'human-approved and reviewed'; }
                else { state = 'pending'; description = 'risk:normal: waiting for human-approved'; }
                return { risk, reasons, review, approved, state, description };
              }

              module.exports = { classify, classifyFile, isPatchBump, humanApproved, reviewState, decide };

              return module.exports; })();
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number || context.payload.issue?.number || Number(context.payload.inputs?.pr);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open') return;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number: number, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: number, per_page: 100 });
            const reactions = await github.paginate(github.rest.reactions.listForIssue, { owner, repo, issue_number: number, per_page: 100 });
            const lastPush = timeline.filter((e) => e.event === 'committed' || e.event === 'head_ref_force_pushed').at(-1);
            const headAt = lastPush?.committer?.date || lastPush?.created_at || pr.created_at;
            const input = {
              author: pr.user.login,
              title: pr.title,
              draft: pr.draft,
              owner: context.repo.owner,
              labels: pr.labels.map((l) => l.name),
              files: files.map((f) => ({ filename: f.filename, status: f.status, patch: f.patch || '', additions: f.additions })),
              labelEvents: timeline.filter((e) => e.event === 'labeled' || e.event === 'unlabeled')
                .map((e) => ({ event: e.event, label: e.label?.name, actor: e.actor?.login, viaApp: !!e.performed_via_github_app })),
              feedback: [
                ...reviews.map((r) => ({ author: r.user?.login || '', body: r.body, at: r.submitted_at })),
                ...comments.map((c) => ({ author: c.user?.login || '', body: c.body, at: c.created_at })),
                ...reviewComments.map((c) => ({ author: c.user?.login || '', body: c.body, at: c.created_at })),
                ...reactions.filter((r) => r.content === '+1').map((r) => ({ author: r.user?.login || '', body: '', at: r.created_at })),
              ],
              headAt,
            };
            const result = gate.decide(input);
            core.info(JSON.stringify(result, null, 2));
            const want = `risk:${result.risk}`;
            const other = result.risk === 'low' ? 'risk:normal' : 'risk:low';
            if (!input.labels.includes(want)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [want] });
            }
            if (input.labels.includes(other)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: other }).catch(() => {});
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'review-gate',
              state: result.state, description: result.description.slice(0, 140),
            });
            await core.summary.addHeading(`review-gate: ${result.state}`).addList([
              `risk: ${result.risk} (${result.reasons.join('; ')})`, `review: ${result.review}`, `human-approved: ${result.approved}`,
            ]).write();
